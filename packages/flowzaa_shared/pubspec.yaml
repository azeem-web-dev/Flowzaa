name: flowzaa_shared
description: Shared models, services, fare engine, theme and widgets for the Flowzaa customer and captain apps.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.1.3

  # Location & maps helpers (map widget itself lives in the apps)
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  http: ^1.2.2

  # Utils
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
